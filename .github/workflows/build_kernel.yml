name: Build SukiSU Ultra Built-in Kernel (Redmi K100 Pro Max)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Android Kernel Source Repository"
        required: true
        default: "https://android.googlesource.com/kernel/common"
      kernel_branch:
        description: "Kernel Branch (Matches songyuan KMI: android16-6.12)"
        required: true
        default: "android16-6.12"
      kernel_commit:
        description: "Exact Stock ACK Commit (songyuan stock: 0d80ee00f747)"
        required: true
        default: "0d80ee00f747"
      susfs_branch:
        description: "SUSFS Branch"
        required: true
        type: choice
        options:
          - "none"
          - "susfs-main"
          - "susfs-test"
        default: "none"
      hook_method:
        description: "Hook Method"
        required: true
        type: choice
        options:
          - "kprobes"
          - "tracepoint"
          - "manual"
        default: "kprobes"
      enable_kpm:
        description: "Enable KPM (CONFIG_KPM=y)"
        required: true
        type: boolean
        default: true
      page_size:
        description: "Kernel Page Size"
        required: true
        type: choice
        options:
          - "4k"
          - "16k"
        default: "4k"

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Fast)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Setup ccache Storage
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ hashFiles('configs/stock_songyuan_6.12.config') }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & Clang Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev libncurses-dev libssl-dev libelf-dev \
            libdw-dev pkg-config python3 python3-pip bc libxml2-utils \
            tar wget libarchive-tools \
            gcc-aarch64-linux-gnu

          # Try installing clang-19; fallback to clang-18
          if sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19; then
            CLANG_VER=19
          else
            sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
            CLANG_VER=18
          fi

          echo "Using Clang version: $CLANG_VER"
          sudo ln -sf /usr/bin/clang-$CLANG_VER /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-$CLANG_VER /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-$CLANG_VER /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-$CLANG_VER /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-$CLANG_VER /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-$CLANG_VER /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-$CLANG_VER /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-$CLANG_VER /usr/bin/llvm-strip

          clang --version
          ld.lld --version

      - name: Fetch Kernel Source Tree (${{ inputs.kernel_commit }})
        run: |
          mkdir -p kernel_workspace
          cd kernel_workspace
          
          echo "=== Fetching Kernel Source for Commit: ${{ inputs.kernel_commit }} ==="
          ARCHIVE_URL="https://android.googlesource.com/kernel/common/+archive/${{ inputs.kernel_commit }}.tar.gz"
          echo "Downloading kernel source archive from $ARCHIVE_URL..."
          
          if curl -f -L --retry 3 --retry-delay 5 "$ARCHIVE_URL" | tar -xz; then
            echo "Successfully extracted kernel source archive."
          else
            echo "Direct archive download failed, falling back to git clone..."
            cd ..
            rm -rf kernel_workspace
            git clone --depth=200 --branch ${{ inputs.kernel_branch }} ${{ inputs.kernel_repo }} kernel_workspace
            cd kernel_workspace
            git checkout ${{ inputs.kernel_commit }} || true
          fi
          
          # Initialize git metadata so SukiSU setup.sh and kernel scripts work seamlessly
          if [ ! -d ".git" ]; then
            git init
            git config user.name "Builder"
            git config user.email "builder@localhost"
            git add -A
            git commit -m "Exact stock ACK commit: ${{ inputs.kernel_commit }}"
          fi
          
          echo "KERNEL_HEAD=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "Kernel source tree ready."

      - name: Integrate SukiSU Ultra BUILT-IN & Apply Linux 6.12 Fixes
        run: |
          cd kernel_workspace
          echo "=== Integrating SukiSU Ultra Built-in ==="
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          if [ -d "KernelSU" ]; then
            echo "SUKISU_COMMIT=$(git -C KernelSU rev-parse HEAD)" >> $GITHUB_ENV
            echo "SukiSU integrated successfully."
          else
            echo "KernelSU directory not found!"
            exit 1
          fi

          echo "=== Patching Linux 6.12 Compatibility for KPM (super_access.c) ==="
          python3 -c "
          import glob, re
          patched_any = False
          for f in glob.glob('**/super_access.c', recursive=True):
              content = open(f, 'r').read()
              new_content = re.sub(
                  r'DEFINE_MEMBER\(netlink_kernel_cfg,\s*cb_mutex\)',
                  '#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 12, 0)\nDEFINE_MEMBER(netlink_kernel_cfg, cb_mutex)\n#endif',
                  content
              )
              if new_content != content:
                  open(f, 'w').write(new_content)
                  print(f'Successfully patched {f} for Linux 6.12 netlink_kernel_cfg compatibility.')
                  patched_any = True
          if not patched_any:
              print('Notice: super_access.c pattern already satisfied or not found.')
          "

      - name: Integrate SUSFS Subsystem
        if: ${{ inputs.susfs_branch != 'none' }}
        run: |
          cd kernel_workspace
          branch="${{ inputs.susfs_branch }}"
          echo "=== Integrating SUSFS ($branch) ==="
          if ! curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$branch"; then
            echo "::warning::SUSFS branch '$branch' not found in SukiSU repo; proceeding with SukiSU core built-in."
          fi

      - name: Apply Exact Stock HyperOS 3 / SM8750 Kernel Config (.config)
        run: |
          cd kernel_workspace
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "Applying exact stock Xiaomi HyperOS 3 (SM8750) kernel config..."
          if [ -f "../configs/stock_songyuan_6.12.config" ]; then
            cp ../configs/stock_songyuan_6.12.config .config
            echo "Successfully copied stock_songyuan_6.12.config into .config"
          else
            echo "Config file not found in repo, generating gki_defconfig fallback..."
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          fi

          echo "Applying SukiSU Core & Stealth Configs..."
          scripts/config --enable CONFIG_KSU

          # Hook method
          if [ "${{ inputs.hook_method }}" = "manual" ]; then
            scripts/config --enable CONFIG_KSU_MANUAL_HOOK
            scripts/config --disable CONFIG_KPROBES
          elif [ "${{ inputs.hook_method }}" = "tracepoint" ]; then
            scripts/config --enable CONFIG_TRACEPOINTS
            scripts/config --disable CONFIG_KSU_MANUAL_HOOK
          else
            scripts/config --enable CONFIG_KPROBES
            scripts/config --enable CONFIG_HAVE_KPROBES
            scripts/config --enable CONFIG_KPROBE_EVENTS
            scripts/config --disable CONFIG_KSU_MANUAL_HOOK
          fi

          # KPM enforcement
          if [ "${{ inputs.enable_kpm }}" = "true" ]; then
            scripts/config --enable CONFIG_KPM
          fi

          # SUSFS Deep Stealth
          scripts/config --enable CONFIG_KSU_SUSFS
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          scripts/config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MAP

          # Page Size (Redmi K100 Pro Max uses 4K Page Size)
          if [ "${{ inputs.page_size }}" = "4k" ]; then
            scripts/config --enable CONFIG_ARM64_4K_PAGES
            scripts/config --disable CONFIG_ARM64_16K_PAGES
            scripts/config --disable CONFIG_ARM64_64K_PAGES
          else
            scripts/config --enable CONFIG_ARM64_16K_PAGES
            scripts/config --disable CONFIG_ARM64_4K_PAGES
            scripts/config --disable CONFIG_ARM64_64K_PAGES
          fi
          # Disable KMI Symbol Trimming & Protected Modules List so modpost passes smoothly
          scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS
          scripts/config --set-str CONFIG_UNUSED_KSYMS_WHITELIST ""
          touch abi_symbollist.raw
          scripts/config --disable CONFIG_MODULE_SIG_PROTECT
          scripts/config --set-str CONFIG_MODULE_SIG_PROTECT_LIST ""
          touch protected_module_names_list

          echo "Refreshing config non-interactively with make olddefconfig..."
          yes "" | make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          # Strict Verification
          echo "--- Configuration Audit ---"
          grep -E "(CONFIG_KSU|CONFIG_KPM|CONFIG_KPROBES|CONFIG_KSU_SUSFS|CONFIG_ARM64_4K_PAGES)" .config || true

          if ! grep -q "^CONFIG_KSU=y" .config; then
            echo "CRITICAL: CONFIG_KSU=y is missing!"
            exit 1
          fi

      - name: Build Kernel Image
        run: |
          cd kernel_workspace
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="5G"
          ccache -s || true

          NTHREADS=$(( $(nproc) * 2 ))
          echo "Building kernel with $NTHREADS parallel threads and ccache acceleration..."
          make -j"$NTHREADS" \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "Build failed: arch/arm64/boot/Image not found!"
            exit 1
          fi
          echo "Kernel compiled successfully. Size: $(stat -c%s arch/arm64/boot/Image) bytes."
          ccache -s || true

      - name: Package Boot Image with AVB Hash Footer (Header v4, 96MB)
        run: |
          mkdir -p out_artifacts
          cp kernel_workspace/arch/arm64/boot/Image out_artifacts/Image
          cp kernel_workspace/.config out_artifacts/build.config

          # Install mkbootimg
          pip3 install --break-system-packages git+https://android.googlesource.com/platform/system/tools/mkbootimg.git || true

          # 1. Create Base Boot Header v4 Image
          if command -v mkbootimg &>/dev/null; then
            mkbootimg \
              --header_version 4 \
              --kernel out_artifacts/Image \
              --pagesize 4096 \
              --output out_artifacts/boot-sukisu-ultra-songyuan-4k.img
          else
            python3 -c "
          import struct
          kernel = open('out_artifacts/Image', 'rb').read()
          header = bytearray(4096)
          header[0:8] = b'ANDROID!'
          struct.pack_into('<I', header, 8, len(kernel))
          struct.pack_into('<I', header, 12, 0)
          struct.pack_into('<I', header, 16, 0)
          struct.pack_into('<I', header, 20, 1584)
          struct.pack_into('<I', header, 40, 4)
          padded_len = ((len(kernel) + 4095) // 4096) * 4096
          padded_kernel = kernel + b'\x00' * (padded_len - len(kernel))
          open('out_artifacts/boot-sukisu-ultra-songyuan-4k.img', 'wb').write(header + padded_kernel)
          "
          fi

          # 2. Add AVB Hash Footer (Partition size 100663296 bytes / 96MB matching songyuan ABL)
          echo "Adding AVB Hash Footer with AOSP avbtool..."
          python3 tools/avbtool.py add_hash_footer \
            --image out_artifacts/boot-sukisu-ultra-songyuan-4k.img \
            --partition_size 100663296 \
            --partition_name boot \
            --rollback_index 1785542400 \
            --prop com.android.build.boot.os_version:16 \
            --prop com.android.build.boot.fingerprint:POCO/songyuan_global/songyuan:16/BQ2A.260225.001-BP2A.250705.008/OS3.0.301.0.WGNTWXM:user/release-keys \
            --prop com.android.build.boot.security_patch:2026-08-01

          # 3. Verify Boot Image & AVB Structure
          echo "=== AVB Audit Information ==="
          python3 tools/avbtool.py info_image --image out_artifacts/boot-sukisu-ultra-songyuan-4k.img

          # Generate SHA256 Checksums
          cd out_artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Kernel-songyuan-android16-6.12
          path: out_artifacts/
          if-no-files-found: error
