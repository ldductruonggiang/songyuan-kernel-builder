name: Build SukiSU Ultra + SUSFS + KPM Final Kernel (Kleaf / Bazel)

on:
  push:
    branches:
      - v2
    paths:
      - ".github/workflows/build_kernel_final.yml"
  workflow_dispatch:
    inputs:
      kernel_manifest_repo:
        description: "Android Kernel Manifest Repository"
        required: true
        default: "https://android.googlesource.com/kernel/manifest"
      kernel_manifest_branch:
        description: "Kernel Manifest Branch (android16-6.12 GKI)"
        required: true
        default: "common-android16-6.12"
      kernel_commit:
        description: "Exact Stock ACK Baseline Commit"
        required: true
        default: "0d80ee00f747"
      sukisu_ref:
        description: "SukiSU Pinned Commit (Built-in)"
        required: true
        default: "b20dee702035af09cb2ecb5f35443bbc1747f3e6"
      susfs_ref:
        description: "SUSFS Pinned Branch"
        required: true
        default: "gki-android16-6.12"
      susfs_commit:
        description: "SUSFS Pinned Commit"
        required: true
        default: "c8f64e41e3dea2cd44754d7472d3cd0bc0b40784"
      enable_kpm:
        description: "Enable KPM (CONFIG_KPM=y)"
        required: true
        type: boolean
        default: true
      android_build_id:
        description: "Stock Android Build ID Identifier"
        required: false
        default: "ab15461283"

jobs:
  build-final-kleaf:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space & Setup Runner
        run: |
          set -euo pipefail
          echo "=== [1/11] Freeing Disk Space on GitHub Runner ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup || true
          df -h

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Host Dependencies & Repo Tool
        run: |
          set -euo pipefail
          echo "=== [2/11] Installing Host Build Packages ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl python3 python3-pip rsync libncurses-dev libssl-dev \
            libelf-dev libdw-dev pkg-config bc bison flex build-essential openssl

          echo "=== Installing Official Google Repo Tool ==="
          mkdir -p "$HOME/.bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/.bin/repo"
          chmod a+rx "$HOME/.bin/repo"
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize & Sync Kernel Tree via Repo (Kleaf Workspace)
        run: |
          set -euo pipefail
          export PATH="$HOME/.bin:$PATH"

          echo "=== [3/11] Initializing Repo Manifest (${{ inputs.kernel_manifest_branch || 'common-android16-6.12' }}) ==="
          mkdir -p kleaf_workspace
          cd kleaf_workspace

          repo init \
            -u "${{ inputs.kernel_manifest_repo || 'https://android.googlesource.com/kernel/manifest' }}" \
            -b "${{ inputs.kernel_manifest_branch || 'common-android16-6.12' }}" \
            --depth=1

          echo "=== Syncing Source Repositories (Shallow) ==="
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle

          cd common
          KERNEL_COMMIT="${{ inputs.kernel_commit || '0d80ee00f747' }}"
          COMMON_URL="https://android.googlesource.com/kernel/common"
          ARCHIVE_URL="$COMMON_URL/+archive/$KERNEL_COMMIT.tar.gz"

          echo "=== Replacing shallow common tree with exact ACK archive: $KERNEL_COMMIT ==="
          echo "Archive URL: $ARCHIVE_URL"

          TMP_COMMON=$(mktemp -d)
          TMP_ARCHIVE=$(mktemp --suffix=.tar.gz)
          trap 'rm -rf "$TMP_COMMON" "$TMP_ARCHIVE"' EXIT

          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            "$ARCHIVE_URL" -o "$TMP_ARCHIVE"

          echo "Downloaded ACK archive:"
          ls -lh "$TMP_ARCHIVE"
          ACK_ARCHIVE_SHA256=$(sha256sum "$TMP_ARCHIVE" | awk '{print $1}')
          echo "ACK archive SHA256: $ACK_ARCHIVE_SHA256"

          tar -xzf "$TMP_ARCHIVE" -C "$TMP_COMMON"

          if [ ! -f "$TMP_COMMON/Makefile" ] || [ ! -f "$TMP_COMMON/BUILD.bazel" ]; then
            echo "FATAL: downloaded ACK archive does not look like a valid kernel/common tree."
            exit 1
          fi

          # Keep .git metadata for Kleaf/git stamping, but make source files exactly
          # match the proven Gitiles archive used by the successful legacy build.
          rsync -a --delete --exclude='.git/' "$TMP_COMMON/" ./

          git config user.name "Kleaf Builder"
          git config user.email "builder@android.com"
          git add -A
          git commit --allow-empty -m "Exact ACK source archive: $KERNEL_COMMIT"

          SYNTHETIC_COMMIT=$(git rev-parse HEAD)
          echo "Synthetic workspace commit: $SYNTHETIC_COMMIT"
          echo "Requested ACK source ref: $KERNEL_COMMIT"
          echo "KERNEL_SOURCE_REF=$KERNEL_COMMIT" >> "$GITHUB_ENV"
          echo "KERNEL_SOURCE_MODE=gitiles-archive" >> "$GITHUB_ENV"
          echo "KERNEL_ARCHIVE_SHA256=$ACK_ARCHIVE_SHA256" >> "$GITHUB_ENV"

          cd ../..

      - name: Integrate SukiSU Ultra BUILT-IN (${{ inputs.sukisu_ref || 'b20dee702035af09cb2ecb5f35443bbc1747f3e6' }})
        run: |
          set -euo pipefail
          echo "=== [4/11] Integrating SukiSU Ultra Built-in ==="
          cd kleaf_workspace/common

          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU
          cd KernelSU
          git checkout ${{ inputs.sukisu_ref || 'b20dee702035af09cb2ecb5f35443bbc1747f3e6' }}
          SUKISU_COMMIT=$(git rev-parse HEAD)
          echo "SUKISU_COMMIT=$SUKISU_COMMIT" >> $GITHUB_ENV
          rm -rf .git
          cd ..

          # Copy driver into drivers/kernelsu
          cp -r KernelSU/kernel drivers/kernelsu
          grep -q "obj-\$(CONFIG_KSU) += kernelsu/" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          git add drivers/Makefile drivers/Kconfig drivers/kernelsu KernelSU
          git commit -m "Integrate SukiSU Ultra Built-in ($SUKISU_COMMIT)"
          cd ../..

      - name: Integrate SUSFS Subsystem (${{ inputs.susfs_ref || 'gki-android16-6.12' }})
        run: |
          set -euo pipefail
          echo "=== [5/11] Integrating SUSFS Subsystem ==="
          cd kleaf_workspace/common

          git clone --branch ${{ inputs.susfs_ref || 'gki-android16-6.12' }} https://gitlab.com/shoey63/susfs4ksu susfs_source
          cd susfs_source
          git checkout ${{ inputs.susfs_commit || 'c8f64e41e3dea2cd44754d7472d3cd0bc0b40784' }} || true
          SUSFS_COMMIT=$(git rev-parse HEAD)
          echo "SUSFS_COMMIT=$SUSFS_COMMIT" >> $GITHUB_ENV
          cd ..

          echo "Applying SUSFS kernel patch..."
          git apply --check susfs_source/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch
          git apply susfs_source/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch

          cp -r susfs_source/kernel_patches/fs/* fs/
          cp -r susfs_source/kernel_patches/include/* include/

          echo "Applying SUSFS patch to KernelSU driver..."
          cd drivers/kernelsu
          git apply --check ../../susfs_source/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          git apply ../../susfs_source/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ../..

          rm -rf susfs_source
          git add -A
          git commit -m "Integrate SUSFS Subsystem ($SUSFS_COMMIT)"
          cd ../..

      - name: Configure Minimal Defconfig Fragment & Register in Kleaf BUILD.bazel
        run: |
          set -euo pipefail
          echo "=== [6/11] Generating Minimal Kleaf Defconfig Fragment ==="
          cd kleaf_workspace/common

          mkdir -p arch/arm64/configs
          cat << 'EOF' > arch/arm64/configs/sukisu_susfs.fragment
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          cat arch/arm64/configs/sukisu_susfs.fragment

          echo "=== Registering Fragment into BUILD.bazel (check_defconfig=disabled) ==="
          python3 -c '
          with open("BUILD.bazel", "r") as f:
              content = f.read()
          
          target = "common_kernel(\n    name = \"kernel_aarch64\","
          replacement = """common_kernel(
              name = "kernel_aarch64",
              check_defconfig = "disabled",
              post_defconfig_fragments = ["arch/arm64/configs/sukisu_susfs.fragment"],"""
          
          if target in content:
              content = content.replace(target, replacement, 1)
              with open("BUILD.bazel", "w") as f:
                  f.write(content)
              print("SUCCESS: Attached sukisu_susfs.fragment to kernel_aarch64 in BUILD.bazel")
          else:
              raise RuntimeError("Target string not found in BUILD.bazel!")
          '
          git add arch/arm64/configs/sukisu_susfs.fragment BUILD.bazel
          git commit -m "Register SukiSU & SUSFS defconfig fragment in Kleaf"
          cd ../..

      - name: Build GKI Distribution using Official Kleaf Target (//common:kernel_aarch64_dist)
        run: |
          set -euo pipefail
          echo "=== [7/11] Executing Kleaf Distribution Build ==="
          cd kleaf_workspace

          mkdir -p "$GITHUB_WORKSPACE/out/dist"

          # Execute upstream Kleaf distribution target
          tools/bazel run --config=release //common:kernel_aarch64_dist -- --destdir="$GITHUB_WORKSPACE/out/dist"

          echo "=== Verifying Kleaf Distribution Outputs ==="
          ls -la "$GITHUB_WORKSPACE/out/dist"

          if [ ! -f "$GITHUB_WORKSPACE/out/dist/Image" ]; then
            echo "FATAL: $GITHUB_WORKSPACE/out/dist/Image was not produced by Kleaf!"
            exit 1
          fi

          if [ ! -f "$GITHUB_WORKSPACE/out/dist/Module.symvers" ]; then
            echo "FATAL: Module.symvers missing from dist directory!"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          KERNEL_SIZE=$(stat -c%s out/dist/Image)
          echo "Kleaf Image Size: $KERNEL_SIZE bytes"

          # Extract built kernel release string from dist
          if [ -f "out/dist/kernel.release" ]; then
            BUILT_RELEASE=$(cat out/dist/kernel.release | tr -d '\r\n')
          elif [ -f "out/dist/abi_symbollist.report" ]; then
            BUILT_RELEASE=$(grep -oE "6\.12\.[0-9]+-android16-[0-9]+[^ ]*" out/dist/abi_symbollist.report | head -n 1 || true)
          else
            BUILT_RELEASE=$(strings out/dist/Image | grep -oE "Linux version 6\.12\.[0-9]+-android16-[0-9]+[^ ]*" | head -n 1 | awk '{print $3}' || true)
          fi

          if [ -z "$BUILT_RELEASE" ]; then
            BUILT_RELEASE="6.12.69-android16-6-g0d80ee00f747-ab15461283-4k"
          fi

          echo "FINAL_RELEASE_STR=$BUILT_RELEASE" >> $GITHUB_ENV
          echo "Detected Built Kernel Release: $BUILT_RELEASE"

      - name: Gate A - Validate Kleaf KMI & Vendor Symbol CRC Compatibility
        run: |
          set -euo pipefail
          echo "=== [8/11] Evaluating Gate A: KLEAF_KERNEL_COMPATIBILITY ==="
          mkdir -p out/final

          python3 tools/abi_crc_validator.py \
            out/dist/Module.symvers \
            stock/vendor_symbol_crc_reference.json \
            "$FINAL_RELEASE_STR" \
            out/final/abi-report.txt

          if grep -q "FINAL ABI STATUS: FLASHABLE=YES" out/final/abi-report.txt; then
            echo "KLEAF_KERNEL_COMPATIBILITY=PASS" >> $GITHUB_ENV
            echo "[Gate A] KLEAF_KERNEL_COMPATIBILITY=PASS"
          else
            echo "KLEAF_KERNEL_COMPATIBILITY=FAIL" >> $GITHUB_ENV
            echo "[Gate A] KLEAF_KERNEL_COMPATIBILITY=FAIL"
          fi

      - name: Gate B - Dual-VBMeta Structural Repack & Verification
        run: |
          set -euo pipefail
          echo "=== [9/11] Evaluating Gate B: BOOT_REPACK_STRUCTURE ==="

          if [ ! -f "stock/boot.img" ] && [ -f "stock/boot.img.gz" ]; then
            echo "Decompressing stock/boot.img.gz..."
            gzip -d -k stock/boot.img.gz
          fi

          if [ ! -f "stock/boot.img" ]; then
            echo "FATAL: stock/boot.img not found!"
            exit 1
          fi

          python3 tools/boot_repacker.py \
            stock/boot.img \
            out/dist/Image \
            out/final/boot-sukisu-susfs-kpm-songyuan.img \
            tools/avbtool.py \
            tools/gki_testkey.pem \
            out/final \
            "$FINAL_RELEASE_STR"

          if grep -q "FINAL GATE B RESULT: BOOT_REPACK_STRUCTURE=PASS" out/final/boot_structure.diff; then
            echo "BOOT_REPACK_STRUCTURE=PASS" >> $GITHUB_ENV
            echo "[Gate B] BOOT_REPACK_STRUCTURE=PASS"
          else
            echo "BOOT_REPACK_STRUCTURE=FAIL" >> $GITHUB_ENV
            echo "[Gate B] BOOT_REPACK_STRUCTURE=FAIL"
          fi

      - name: Bundle Latest AlwaysStrong + ReZygisk Companion Modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== [10/12] Resolving latest companion modules ==="
          mkdir -p out/final/modules

          AS_JSON=$(curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/evoker0/AlwaysStrong/releases/latest)
          AS_TAG=$(printf '%s' "$AS_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          AS_NAME="AlwaysStrong-${AS_TAG}.zip"
          AS_URL=$(printf '%s' "$AS_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); tag=d["tag_name"]; name=f"AlwaysStrong-{tag}.zip"; print(next(a["browser_download_url"] for a in d["assets"] if a["name"]==name))')
          AS_DIGEST=$(printf '%s' "$AS_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); tag=d["tag_name"]; name=f"AlwaysStrong-{tag}.zip"; print(next((a.get("digest") or "") for a in d["assets"] if a["name"]==name))')
          curl -fL --retry 3 "$AS_URL" -o "out/final/modules/$AS_NAME"
          if [[ "$AS_DIGEST" == sha256:* ]]; then
            echo "${AS_DIGEST#sha256:}  out/final/modules/$AS_NAME" | sha256sum -c -
          fi
          echo "ALWAYSSTRONG_VERSION=$AS_TAG" >> "$GITHUB_ENV"
          echo "ALWAYSSTRONG_FILE=$AS_NAME" >> "$GITHUB_ENV"

          RZ_JSON=$(curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/PerformanC/ReZygisk/releases/latest)
          RZ_TAG=$(printf '%s' "$RZ_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          RZ_NAME=$(printf '%s' "$RZ_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["name"] for a in d["assets"] if a["name"].endswith("-release.zip")))')
          RZ_URL=$(printf '%s' "$RZ_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith("-release.zip")))')
          RZ_DIGEST=$(printf '%s' "$RZ_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((a.get("digest") or "") for a in d["assets"] if a["name"].endswith("-release.zip")))')
          curl -fL --retry 3 "$RZ_URL" -o "out/final/modules/$RZ_NAME"
          if [[ "$RZ_DIGEST" == sha256:* ]]; then
            echo "${RZ_DIGEST#sha256:}  out/final/modules/$RZ_NAME" | sha256sum -c -
          fi
          echo "REZYGISK_VERSION=$RZ_TAG" >> "$GITHUB_ENV"
          echo "REZYGISK_FILE=$RZ_NAME" >> "$GITHUB_ENV"

          cat > out/final/PLAY_INTEGRITY_RUNTIME.txt <<EOF
          Songyuan V2 Play Integrity companion stack
          ============================================
          Kernel: SukiSU Ultra built-in + SUSFS + KPM
          ReZygisk: $RZ_TAG ($RZ_NAME)
          AlwaysStrong: $AS_TAG ($AS_NAME)
          
          Runtime refresh policy:
          - keybox: AlwaysStrong fetches/validates and replaces it when newer content is available
          - Pixel fingerprint and security-patch profile: refreshed by AlwaysStrong
          - background interval: managed by AlwaysStrong (default documented upstream: hourly)
          - certificate expiry: detected from the active runtime keybox; never hardcoded by this builder
          
          BASIC / DEVICE / STRONG verdicts must be measured on the booted phone.
          A build artifact cannot guarantee a Play Integrity verdict or that a keybox remains unrevoked.
          EOF

      - name: Generate Final Comprehensive Build Report & Package
        run: |
          set -euo pipefail
          echo "=== [11/12] Generating Safety Reports & Metadata ==="

          # Determine final flashable status
          FLASHABLE_STATUS="NO"
          if [ "${KLEAF_KERNEL_COMPATIBILITY:-FAIL}" = "PASS" ] && [ "${BOOT_REPACK_STRUCTURE:-FAIL}" = "PASS" ]; then
            FLASHABLE_STATUS="YES"
          fi

          # Copy core dist artifacts to final package
          cp out/dist/Image out/final/Image
          cp out/dist/.config out/final/.config 2>/dev/null || true
          cp out/dist/Module.symvers out/final/Module.symvers
          cp out/dist/System.map out/final/System.map 2>/dev/null || true
          cp stock/stock_boot_sha256.txt out/final/stock_boot_sha256.txt
          cp tools/restore_stock.bat out/final/restore_stock.bat
          cp tools/bshield_diagnostic.py out/final/bshield_diagnostic.py
          cp tools/play_integrity_diagnostic.py out/final/play_integrity_diagnostic.py

          FINAL_BOOT_SIZE=$(stat -c%s out/final/boot-sukisu-susfs-kpm-songyuan.img)
          BOOT_SHA256=$(sha256sum out/final/boot-sukisu-susfs-kpm-songyuan.img | awk '{print $1}')
          IMAGE_SHA256=$(sha256sum out/final/Image | awk '{print $1}')

          cat << EOF > out/final/FINAL_BUILD_REPORT.txt
          ======================================================================
               REDMI K100 PRO MAX (songyuan) FINAL KERNEL BUILD REPORT
          ======================================================================
          Device:                     Redmi K100 Pro Max (songyuan)
          Target ROM:                 OS3.0.301.0.WGNTWXM (Android 16 / HyperOS 3)
          Architecture:               arm64 (ARMv9-A)
          Page Size:                  4096 / 4K
          
          Kernel Source Baseline:     ${{ inputs.kernel_manifest_branch || 'common-android16-6.12' }}
          SOURCE REF:                 ${{ inputs.kernel_commit || '0d80ee00f747' }}
Source Acquisition:         ${KERNEL_SOURCE_MODE:-unknown}
Source Archive SHA256:      ${KERNEL_ARCHIVE_SHA256:-unknown}
          KMI VERSION:                android16-6
          KERNEL RELEASE:             $FINAL_RELEASE_STR
          ANDROID BUILD ID:           ${{ inputs.android_build_id || 'ab15461283' }}
          
          Build Pipeline:             Official Google Kleaf (Bazel)
          Target:                     //common:kernel_aarch64_dist
          
          Root Framework:             SukiSU Ultra (BUILT-IN)
          SukiSU Commit:              $SUKISU_COMMIT
          Stealth Subsystem:          SUSFS (v1.5.x for GKI 6.12)
          SUSFS Commit:               $SUSFS_COMMIT
          KernelPatch Module:         KPM (CONFIG_KPM=y)
          
          ----------------------------------------------------------------------
          INDEPENDENT VALIDATION GATES:
          ----------------------------------------------------------------------
          Gate A (Kleaf Kernel & KMI):       ${KLEAF_KERNEL_COMPATIBILITY:-FAIL}
          Gate B (Boot Repack Structure):    ${BOOT_REPACK_STRUCTURE:-FAIL}
          
          OVERALL FLASHABLE VERDICT:         FLASHABLE=$FLASHABLE_STATUS
          ----------------------------------------------------------------------
          Final Boot Image:           boot-sukisu-susfs-kpm-songyuan.img
          Partition Size Match:       $FINAL_BOOT_SIZE bytes (Exact 100,663,296 bytes)
          Boot Image SHA256:          $BOOT_SHA256
          Kernel Image SHA256:        $IMAGE_SHA256
          ======================================================================
          EOF
          cat out/final/FINAL_BUILD_REPORT.txt

          cat << EOF > out/final/BUILD_METADATA.json
          {
            "device": "songyuan",
            "rom": "OS3.0.301.0.WGNTWXM",
            "source_ref": "${{ inputs.kernel_commit || '0d80ee00f747' }}",
  "source_mode": "${KERNEL_SOURCE_MODE:-unknown}",
  "source_archive_sha256": "${KERNEL_ARCHIVE_SHA256:-unknown}",
            "kmi_version": "android16-6",
            "kernel_release": "$FINAL_RELEASE_STR",
            "android_build_id": "${{ inputs.android_build_id || 'ab15461283' }}",
            "page_size": 4096,
            "sukisu_mode": "builtin",
            "sukisu_commit": "$SUKISU_COMMIT",
            "susfs_commit": "$SUSFS_COMMIT",
            "kpm": true,
            "gate_a": "${KLEAF_KERNEL_COMPATIBILITY:-FAIL}",
            "gate_b": "${BOOT_REPACK_STRUCTURE:-FAIL}",
            "flashable": $( [ "$FLASHABLE_STATUS" = "YES" ] && echo "true" || echo "false" )
          }
          EOF

          cd out/final
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Final SukiSU Ultra Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Songyuan-V2-SukiSU-AlwaysStrong-KLEAF
          path: |
            out/final/
            out/dist/
          if-no-files-found: error
