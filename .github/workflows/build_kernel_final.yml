name: Build SukiSU Ultra + SUSFS + KPM Final Kernel (Redmi K100 Pro Max)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Android Kernel Source Repository"
        required: true
        default: "https://android.googlesource.com/kernel/common"
      kernel_branch:
        description: "Kernel Branch (Matches songyuan: android16-6.12)"
        required: true
        default: "android16-6.12"
      kernel_commit:
        description: "Exact Stock ACK Commit"
        required: true
        default: "0d80ee00f747"
      sukisu_ref:
        description: "SukiSU Pinned Commit / Branch"
        required: true
        default: "b20dee702035af09cb2ecb5f35443bbc1747f3e6"
      susfs_ref:
        description: "SUSFS Pinned Branch / Commit"
        required: true
        default: "gki-android16-6.12"
      enable_kpm:
        description: "Enable KPM (CONFIG_KPM=y)"
        required: true
        type: boolean
        default: true
      enable_susfs_spoof_uname:
        description: "Enable SUSFS Spoof Uname (Default: false)"
        required: false
        type: boolean
        default: false
      enable_susfs_spoof_cmdline:
        description: "Enable SUSFS Spoof Cmdline/Bootconfig (Default: false)"
        required: false
        type: boolean
        default: false
      enable_susfs_hide_symbols:
        description: "Enable SUSFS Hide Symbols (Default: false)"
        required: false
        type: boolean
        default: false

jobs:
  build-final:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Host Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git automake flex bison build-essential \
            curl wget tar libarchive-tools bc \
            libncurses-dev libssl-dev libelf-dev libdw-dev pkg-config \
            python3 python3-pip gcc-aarch64-linux-gnu

      - name: Download & Verify Official Google Android Clang (r536225) & Rust (1.82.0)
        run: |
          set -euo pipefail
          mkdir -p toolchain/clang toolchain/rust

          echo "=== [1/2] Fetching Official Google Android Clang 19.0.1 (r536225) ==="
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
          curl -f -L --retry 3 --retry-delay 5 "$CLANG_URL" | tar -xz -C toolchain/clang

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          CLANG_VER=$(clang --version | head -n 1)
          echo "Installed Clang: $CLANG_VER"

          if ! echo "$CLANG_VER" | grep -q "19.0.1"; then
            echo "FATAL: Clang version 19.0.1 expected, got: $CLANG_VER"
            exit 1
          fi
          if ! echo "$CLANG_VER" | grep -q "r536225"; then
            echo "FATAL: Clang revision r536225 expected, got: $CLANG_VER"
            exit 1
          fi

          echo "=== [2/2] Fetching Official Google Android Rust 1.82.0 ==="
          RUST_URL="https://android.googlesource.com/platform/prebuilts/rust/+archive/refs/heads/main/linux-x86/1.82.0.tar.gz"
          curl -f -L --retry 3 --retry-delay 5 "$RUST_URL" | tar -xz -C toolchain/rust || true

          if [ -f "$GITHUB_WORKSPACE/toolchain/rust/bin/rustc" ]; then
            export PATH="$GITHUB_WORKSPACE/toolchain/rust/bin:$PATH"
            echo "Installed Rust: $(rustc --version)"
          fi

          echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH
          if [ -d "$GITHUB_WORKSPACE/toolchain/rust/bin" ]; then
            echo "$GITHUB_WORKSPACE/toolchain/rust/bin" >> $GITHUB_PATH
          fi

      - name: Fetch Exact ACK Kernel Source Tree (${{ inputs.kernel_commit }})
        run: |
          set -euo pipefail
          echo "=== Cloning Kernel Source from ${{ inputs.kernel_repo }} ==="
          git clone --depth=100 --branch ${{ inputs.kernel_branch }} ${{ inputs.kernel_repo }} kernel_workspace
          cd kernel_workspace

          echo "Checking out exact commit: ${{ inputs.kernel_commit }}..."
          git checkout ${{ inputs.kernel_commit }}

          HEAD_COMMIT=$(git rev-parse HEAD)
          echo "Current HEAD: $HEAD_COMMIT"
          if ! echo "$HEAD_COMMIT" | grep -q "^${{ inputs.kernel_commit }}"; then
            echo "FATAL: HEAD commit $HEAD_COMMIT does not match ${{ inputs.kernel_commit }}!"
            exit 1
          fi

          git config user.name "AOSP Builder"
          git config user.email "builder@android.com"

      - name: Configure Exact Kernel Release Versioning (Clean, No -dirty)
        run: |
          set -euo pipefail
          cd kernel_workspace

          # Set Android Release Identifier in localversion-android
          # Stock target: 6.12.69-android16-6-g0d80ee00f747-ab15461283-4k
          echo "-android16-6-g0d80ee00f747-ab15461283" > localversion-android

          git add localversion-android
          git commit -m "Set exact Android KMI release tag"

      - name: Integrate SukiSU Ultra BUILT-IN (Pinned: ${{ inputs.sukisu_ref }})
        run: |
          set -euo pipefail
          cd kernel_workspace

          echo "=== Integrating SukiSU Ultra Built-in ==="
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU
          cd KernelSU
          git checkout ${{ inputs.sukisu_ref }}
          SUKISU_COMMIT=$(git rev-parse HEAD)
          echo "SUKISU_COMMIT=$SUKISU_COMMIT" >> $GITHUB_ENV
          cd ..

          # Link driver and register in Makefile & Kconfig
          ln -sf ../../KernelSU/kernel drivers/kernelsu
          grep -q "obj-\$(CONFIG_KSU) += kernelsu/" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          git add drivers/Makefile drivers/Kconfig drivers/kernelsu KernelSU
          git commit -m "Integrate SukiSU Ultra Built-in ($SUKISU_COMMIT)"

      - name: Integrate SUSFS Subsystem (Pinned: ${{ inputs.susfs_ref }})
        run: |
          set -euo pipefail
          cd kernel_workspace

          echo "=== Cloning SUSFS Subsystem (${{ inputs.susfs_ref }}) ==="
          git clone --branch ${{ inputs.susfs_ref }} https://gitlab.com/shoey63/susfs4ksu susfs_source
          cd susfs_source
          SUSFS_COMMIT=$(git rev-parse HEAD)
          echo "SUSFS_COMMIT=$SUSFS_COMMIT" >> $GITHUB_ENV
          cd ..

          echo "Applying kernel patches for SUSFS (50_add_susfs_in_gki-android16-6.12.patch)..."
          git apply --check susfs_source/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch
          git apply susfs_source/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch

          cp -r susfs_source/kernel_patches/fs/* fs/
          cp -r susfs_source/kernel_patches/include/* include/

          echo "Applying SUSFS patch for KernelSU (10_enable_susfs_for_ksu.patch)..."
          cd KernelSU
          git apply --check ../susfs_source/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          git apply ../susfs_source/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ..

          rm -rf susfs_source
          git add -A
          git commit -m "Integrate SUSFS Subsystem ($SUSFS_COMMIT)"

      - name: Apply Exact Stock Config & Enforce Core Hardening
        run: |
          set -euo pipefail
          cd kernel_workspace

          echo "=== Applying Stock HyperOS 3 (SM8750) Kernel Config ==="
          if [ ! -f "../configs/stock_songyuan_6.12.config" ]; then
            echo "FATAL: configs/stock_songyuan_6.12.config not found!"
            exit 1
          fi
          cp ../configs/stock_songyuan_6.12.config .config
          cp .config config_before.txt

          echo "=== Generating GKI Symbol Whitelist from Source Symbols ==="
          mkdir -p gki/aarch64/symbols
          cat gki/aarch64/symbols/* 2>/dev/null | grep -v "^#" | grep -v "^\\[" | sort -u > abi_symbollist.raw || true
          if [ ! -s abi_symbollist.raw ]; then
            touch abi_symbollist.raw
          fi
          touch protected_module_names_list

          echo "=== Configuring SukiSU & KPM Core ==="
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_HAVE_KPROBES
          scripts/config --enable CONFIG_KPROBE_EVENTS
          scripts/config --disable CONFIG_KSU_MANUAL_HOOK

          if [ "${{ inputs.enable_kpm }}" = "true" ]; then
            scripts/config --enable CONFIG_KPM
          fi

          echo "=== Configuring SUSFS Core Options ==="
          scripts/config --enable CONFIG_KSU_SUSFS
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MAP

          if [ "${{ inputs.enable_susfs_spoof_uname }}" = "true" ]; then
            scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          else
            scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_UNAME
          fi

          if [ "${{ inputs.enable_susfs_spoof_cmdline }}" = "true" ]; then
            scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          else
            scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          fi

          if [ "${{ inputs.enable_susfs_hide_symbols }}" = "true" ]; then
            scripts/config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          else
            scripts/config --disable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          fi

          echo "=== Preserving Exact 4K Page Size & Stock Modversions ==="
          scripts/config --enable CONFIG_ARM64_4K_PAGES
          scripts/config --disable CONFIG_ARM64_16K_PAGES
          scripts/config --disable CONFIG_ARM64_64K_PAGES

          scripts/config --set-str CONFIG_LOCALVERSION "-4k"
          scripts/config --disable CONFIG_LOCALVERSION_AUTO

          echo "=== Refreshing Configuration with make olddefconfig ==="
          yes "" | make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          cp .config config_after.txt
          diff -u config_before.txt config_after.txt > config_diff.txt || true

          echo "=== Validating Critical Kernel Configurations ==="
          grep -E "(CONFIG_KSU|CONFIG_KPM|CONFIG_KSU_SUSFS|CONFIG_ARM64_4K_PAGES|CONFIG_MODVERSIONS)" .config

          if ! grep -q "^CONFIG_KSU=y$" .config; then
            echo "FATAL: CONFIG_KSU=y is missing after olddefconfig!"
            exit 1
          fi
          if [ "${{ inputs.enable_kpm }}" = "true" ] && ! grep -q "^CONFIG_KPM=y$" .config; then
            echo "FATAL: CONFIG_KPM=y is missing after olddefconfig!"
            exit 1
          fi
          if ! grep -q "^CONFIG_KSU_SUSFS=y$" .config; then
            echo "FATAL: CONFIG_KSU_SUSFS=y is missing after olddefconfig!"
            exit 1
          fi
          if ! grep -q "^CONFIG_ARM64_4K_PAGES=y$" .config; then
            echo "FATAL: CONFIG_ARM64_4K_PAGES=y is missing after olddefconfig!"
            exit 1
          fi

      - name: Build FINAL Kernel Image
        run: |
          set -euo pipefail
          cd kernel_workspace

          echo "=== Compiling Final Kernel with Google Android Clang r536225 ==="
          NTHREADS=$(nproc)
          make -j"$NTHREADS" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "FATAL: arch/arm64/boot/Image was not created!"
            exit 1
          fi

          KERNEL_SIZE=$(stat -c%s arch/arm64/boot/Image)
          echo "Final Kernel compiled successfully. Size: $KERNEL_SIZE bytes."

          RELEASE_STR=$(make -s ARCH=arm64 kernelrelease)
          echo "FINAL_RELEASE_STR=$RELEASE_STR" >> $GITHUB_ENV
          echo "Built Kernel Release: $RELEASE_STR"

          if echo "$RELEASE_STR" | grep -q -- "-dirty"; then
            echo "FATAL: Kernel release contains -dirty flag! $RELEASE_STR"
            exit 1
          fi

      - name: Validate ABI & Symbol CRC Compatibility Gate
        run: |
          set -euo pipefail
          mkdir -p out/final

          echo "=== Running ABI & Symbol CRC Gate Validator ==="
          python3 tools/abi_crc_validator.py \
            kernel_workspace/Module.symvers \
            stock/vendor_symbol_crc_reference.json \
            "$FINAL_RELEASE_STR" \
            out/final/abi-report.txt

      - name: Repack Final Boot Image from Stock Template (Fail-Closed)
        run: |
          set -euo pipefail

          if [ ! -f "stock/boot.img" ] && [ -f "stock/boot.img.gz" ]; then
            echo "Decompressing stock/boot.img.gz..."
            gzip -d -k stock/boot.img.gz
          fi

          if [ ! -f "stock/boot.img" ]; then
            echo "FATAL: stock/boot.img is missing! Cannot proceed with template repack."
            exit 1
          fi

          echo "=== Repacking Final Boot Image with Preserved AVB Structure ==="
          python3 tools/boot_repacker.py \
            stock/boot.img \
            kernel_workspace/arch/arm64/boot/Image \
            out/final/boot-sukisu-susfs-kpm-songyuan.img \
            tools/avbtool.py

          if [ ! -f "out/final/boot-sukisu-susfs-kpm-songyuan.img" ]; then
            echo "FATAL: boot-sukisu-susfs-kpm-songyuan.img not found!"
            exit 1
          fi

          # Size Gate (100,663,296 bytes)
          FINAL_BOOT_SIZE=$(stat -c%s out/final/boot-sukisu-susfs-kpm-songyuan.img)
          echo "Final boot image size: $FINAL_BOOT_SIZE bytes."
          if [ "$FINAL_BOOT_SIZE" -ne 100663296 ]; then
            echo "FATAL: Boot size $FINAL_BOOT_SIZE does not match partition size 100663296!"
            exit 1
          fi

      - name: Generate Final Safety Reports & Metadata
        run: |
          set -euo pipefail

          cp kernel_workspace/arch/arm64/boot/Image out/final/Image
          cp kernel_workspace/.config out/final/.config
          cp kernel_workspace/Module.symvers out/final/Module.symvers
          cp kernel_workspace/System.map out/final/System.map 2>/dev/null || true
          cp stock/stock_boot_sha256.txt out/final/stock_boot_sha256.txt
          cp tools/restore_stock.bat out/final/restore_stock.bat
          cp tools/bshield_diagnostic.py out/final/bshield_diagnostic.py
          cp tools/play_integrity_diagnostic.py out/final/play_integrity_diagnostic.py

          # Read ABI status from abi-report.txt
          FLASHABLE_STATUS="NO"
          if grep -q "FINAL ABI STATUS: FLASHABLE=YES" out/final/abi-report.txt; then
            FLASHABLE_STATUS="YES"
          fi

          BOOT_SHA256=$(sha256sum out/final/boot-sukisu-susfs-kpm-songyuan.img | awk '{print $1}')
          IMAGE_SHA256=$(sha256sum out/final/Image | awk '{print $1}')

          cat <<EOF > out/final/FINAL_BUILD_REPORT.txt
==================================================
  REDMI K100 PRO MAX (songyuan) FINAL KERNEL REPORT
==================================================
Device:                 Redmi K100 Pro Max (songyuan)
ROM Version:            OS3.0.301.0.WGNTWXM (Android 16 / HyperOS 3)
Target Arch / Page:     arm64 / 4096 (4KB)
Kernel Baseline:        android16-6.12 @ 0d80ee00f747
Toolchain:              Google Android Clang 19.0.1 (r536225)

Stock Kernel Release:   6.12.69-android16-6-g0d80ee00f747-ab15461283-4k
Final Kernel Release:   $FINAL_RELEASE_STR

Root Framework:         SukiSU Ultra (BUILT-IN)
SukiSU Commit:          $SUKISU_COMMIT
Stealth Subsystem:      SUSFS (v1.5.x for GKI 6.12)
SUSFS Commit:           $SUSFS_COMMIT
KernelPatch Module:     KPM (CONFIG_KPM=y)
Hook Method:            Kprobes (CONFIG_KPROBES=y)

SELinux Status:         Enforcing (Unmodified)
BShield Hardening:      Standard VMA layout, Clean Release, Zero Dirty Flags

Final Boot Image:       boot-sukisu-susfs-kpm-songyuan.img
Boot Image Size:        $FINAL_BOOT_SIZE bytes (Exact 96MB Partition Match)
Boot Image SHA256:      $BOOT_SHA256
Kernel Image SHA256:    $IMAGE_SHA256

FINAL FLASHABLE STATUS: FLASHABLE=$FLASHABLE_STATUS
==================================================
EOF
          cat out/final/FINAL_BUILD_REPORT.txt

          cat <<EOF > out/final/BUILD_METADATA.json
{
  "device": "songyuan",
  "rom": "OS3.0.301.0.WGNTWXM",
  "kernel_commit": "0d80ee00f747",
  "toolchain": "r536225",
  "page_size": 4096,
  "sukisu_mode": "builtin",
  "sukisu_commit": "$SUKISU_COMMIT",
  "susfs": true,
  "susfs_commit": "$SUSFS_COMMIT",
  "kpm": true,
  "hook": "kprobes",
  "flashable": $( [ "$FLASHABLE_STATUS" = "YES" ] && echo "true" || echo "false" )
}
EOF

          cd out/final
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Upload Final SukiSU Ultra Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-songyuan-FINAL
          path: out/final/
          if-no-files-found: error
