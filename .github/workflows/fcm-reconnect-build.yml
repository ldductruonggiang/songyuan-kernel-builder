name: Build FCM Reconnect APK

on:
  push:
    branches: [ fcm-reconnect-app ]
    paths:
      - 'FCMReconnect/**'
      - '.github/workflows/fcm-reconnect-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'FCMReconnect/**'
      - '.github/workflows/fcm-reconnect-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FCMReconnect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FCM-Reconnect-APK
          path: FCMReconnect/app/build/outputs/apk/debug/app-debug.apk
