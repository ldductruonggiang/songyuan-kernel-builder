name: Build FCM Reconnect APK

on:
  push:
    branches: [ fcm-reconnect-app ]
    paths:
      - 'FCMReconnect/**'
      - '.github/workflows/fcm-reconnect-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FCMReconnect

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fcm-reconnect-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Keep APK in branch
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/FCM-Reconnect-v1.0.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/FCM-Reconnect-v1.0.0-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build FCM Reconnect APK [skip-fcm-build]"
            git push origin HEAD:fcm-reconnect-app
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FCM-Reconnect-APK
          path: FCMReconnect/app/build/outputs/apk/debug/app-debug.apk
